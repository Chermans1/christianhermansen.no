<title>Prosjektlageret Øyane</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{
    --navy:#1F3A5F; --navy2:#16293F; --papir:#F7F8FB; --panel:#EEF2F7;
    --gul:#FFF3C4; --gultekst:#7A5C00; --gronn:#2E7D52; --gronnlys:#E4F0E8;
    --rod:#A63A3A; --rodlys:#F5D9D9; --gra:#5A6472; --strek:#D7DEE8;
    --blekk:#22303F; --hvit:#FFFFFF;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{
    margin:0; background:var(--papir); color:var(--blekk);
    font-family:"Atkinson Hyperlegible", Arial, sans-serif;
    font-size:16px; line-height:1.5;
  }
  h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",Arial,sans-serif; text-wrap:balance; margin:0}
  .tall{font-variant-numeric:tabular-nums}

  header{background:var(--navy); color:var(--hvit); padding:24px 20px 26px}
  .hwrap{max-width:900px; margin:0 auto}
  .eyebrow{text-transform:uppercase; letter-spacing:.09em; font-size:12px; color:#BFD0E6; margin:0 0 6px}
  header h1{font-size:32px; line-height:1.1}
  header p.under{margin:8px 0 0; color:#D7E2F0; max-width:38em}

  main{max-width:900px; margin:0 auto; padding:22px 20px 150px; display:flex; flex-direction:column; gap:20px}
  button{font-family:inherit; font-size:15px; cursor:pointer; border-radius:8px}
  button:focus-visible, input:focus-visible, textarea:focus-visible, [role="switch"]:focus-visible{outline:3px solid #6FA8DC; outline-offset:2px}

  .kort{background:var(--hvit); border:1px solid var(--strek); border-radius:14px; padding:22px 22px 20px}

  /* Forside */
  .nyprosjekt{width:100%; background:var(--navy); color:var(--hvit); border:none; padding:18px; font-size:18px; font-weight:700; border-radius:14px}
  .nyprosjekt:hover{background:#28497A}
  .prosjektgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media (max-width:680px){ .prosjektgrid{grid-template-columns:1fr} }
  .pkort{background:var(--hvit); border:1px solid var(--strek); border-radius:14px; padding:18px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:8px}
  .pkort:hover{border-color:var(--navy)}
  .pkort h3{font-size:19px}
  .pkort .meta{color:var(--gra); font-size:14px}
  .pkort .rad2{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:2px}
  .spill{padding:5px 12px; border-radius:99px; font-weight:700; font-size:13px; color:var(--hvit); white-space:nowrap}
  .spill.gronn{background:var(--gronn)} .spill.rod{background:var(--rod)} .spill.noytral{background:#7E93AE}
  .pslett{background:none; border:none; color:#9AA6B5; font-size:14px; padding:4px 8px}
  .pslett:hover{color:var(--rod)}
  .tomt{color:var(--gra); text-align:center; padding:30px 10px; border:1.5px dashed var(--strek); border-radius:14px}

  /* Prosjekttopp + faner */
  .prosjekttopp{display:flex; flex-direction:column; gap:10px}
  .tilbake{align-self:flex-start; background:none; border:none; color:var(--navy); font-weight:700; padding:4px 0; font-size:15px}
  .tilbake:hover{text-decoration:underline}
  .navnfelt{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",Arial,sans-serif; font-size:27px; font-weight:700;
    border:none; border-bottom:2px solid transparent; background:transparent; color:var(--blekk); width:100%; padding:2px 0}
  .navnfelt:hover,.navnfelt:focus{border-bottom-color:var(--strek); outline:none}
  .navnfelt::placeholder{color:#A6B1BF}
  .tabbar{display:flex; gap:6px; flex-wrap:wrap; border-bottom:2px solid var(--strek)}
  .tabbar button{background:none; border:none; border-bottom:3px solid transparent; border-radius:0;
    padding:10px 14px; font-size:15.5px; font-weight:700; color:var(--gra); margin-bottom:-2px}
  .tabbar button:hover{color:var(--navy)}
  .tabbar button.aktiv{color:var(--navy); border-bottom-color:var(--navy)}

  /* Skjemafelt */
  .infogrid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media (max-width:640px){ .infogrid{grid-template-columns:1fr} }
  label.felt{display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:14px}
  label.felt .hint{font-weight:400; color:var(--gra); font-size:13px}
  input[type="text"], textarea{
    font-family:inherit; font-size:16px; padding:10px 12px; border:1.5px solid var(--strek);
    border-radius:8px; background:var(--hvit); color:var(--blekk); width:100%;
  }
  textarea{resize:vertical; min-height:84px}
  input[type="text"]:hover, textarea:hover{border-color:#B8C4D4}
  .stegintro{margin:4px 0 16px; color:var(--gra); max-width:42em}
  .steghode{display:flex; gap:14px; align-items:flex-start; margin-bottom:6px}
  .stegnr{flex:0 0 auto; width:40px; height:40px; border-radius:50%; background:var(--navy); color:var(--hvit);
    display:flex; align-items:center; justify-content:center; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:19px}
  .steghode h2{font-size:22px; padding-top:5px}

  /* Linjer */
  .linjer{display:flex; flex-direction:column; gap:8px}
  .linje{display:grid; grid-template-columns:1fr 130px 34px; gap:8px; align-items:center}
  .linje input.belop{text-align:right}
  .slett{background:none; border:none; color:#9AA6B5; font-size:20px; line-height:1; padding:4px}
  .slett:hover{color:var(--rod)}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0}
  .chips button{background:var(--panel); border:1px solid var(--strek); color:var(--navy); padding:7px 13px; border-radius:99px; font-size:14px}
  .chips button:hover{background:#E2E9F2}
  .leggtil{margin-top:10px; background:none; border:1.5px dashed #B8C4D4; color:var(--navy); padding:9px 14px; width:100%; font-weight:700}
  .leggtil:hover{border-color:var(--navy)}
  .sumlinje{display:flex; justify-content:space-between; align-items:baseline; border-top:2px solid var(--navy);
    margin-top:16px; padding-top:10px; font-weight:700; font-size:18px}
  .gulboks{background:var(--gul); color:var(--gultekst); border-radius:10px; padding:12px 14px; font-size:14.5px; margin-top:14px}
  .gulboks b{color:var(--gultekst)}

  .lederpost{margin-top:16px; border:1.5px solid var(--strek); border-radius:10px; padding:14px}
  .lederpost .bryterrad{display:flex; gap:10px; align-items:center; font-weight:700}
  .lederpost .innhold{display:none; margin-top:12px}
  .lederpost.aktiv .innhold{display:block}
  .lederpost p.note{margin:10px 0 0; font-size:13.5px; color:var(--gra)}

  .egengrid{display:grid; grid-template-columns:110px 30px 130px 1fr; gap:8px; align-items:end; max-width:480px}
  .egengrid .ganger,.egengrid .egenres{padding-bottom:10px}
  .egengrid .ganger{text-align:center; color:var(--gra); font-size:18px}
  .egengrid input{text-align:right}
  .egenres{font-weight:700; text-align:right}
  .tilskuddrad{display:grid; grid-template-columns:1fr 130px auto 34px; gap:8px; align-items:center}
  .tilskuddrad input.belop{text-align:right}
  .jaknapp{border:1.5px solid var(--strek); background:var(--hvit); color:var(--gra); padding:8px 12px; font-weight:700; font-size:13px; white-space:nowrap}
  .jaknapp.ja{background:var(--gronnlys); border-color:var(--gronn); color:var(--gronn)}
  .tilskuddrad.venter input.belop{color:#8A93A0; text-decoration:line-through}

  .regnestykke{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:baseline; font-size:20px; margin:6px 0 14px}
  .regnestykke .tall{font-weight:700; font-size:26px}
  .status{border-radius:12px; padding:18px; font-size:17px}
  .status.gronn{background:var(--gronnlys); color:#1E5238}
  .status.rod{background:var(--rodlys); color:#6E2323}
  .status.noytral{background:var(--panel); color:var(--gra)}
  .status b{font-size:19px}
  .treknapper{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
  @media (max-width:640px){ .treknapper{grid-template-columns:1fr} }
  .treknapper div{background:var(--hvit); border:1.5px solid var(--rod); border-radius:10px; padding:12px; font-size:14.5px}
  .treknapper b{display:block; margin-bottom:4px; color:var(--rod)}

  /* Huskeliste */
  .huskeliste{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  .huskeliste li{display:grid; grid-template-columns:26px 1fr 34px; gap:8px; align-items:center}
  .huskeliste input[type="checkbox"]{width:20px; height:20px; accent-color:var(--gronn)}
  .huskeliste li.gjort input[type="text"]{text-decoration:line-through; color:#8A93A0}

  /* Rapport-tab */
  .rrad{display:grid; grid-template-columns:1fr 110px 110px; gap:8px; align-items:center}
  .rrad .rtekst{overflow-wrap:anywhere}
  .rrad .rbud{text-align:right; color:var(--gra)}
  .rrad input{text-align:right; background:#FBFCFE; border-style:dashed}
  .rhode{display:grid; grid-template-columns:1fr 110px 110px; gap:8px; font-size:12px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--gra); margin-bottom:6px}
  .rhode span{text-align:right}
  .rhode span:first-child{text-align:left}
  .sjekkliste{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
  .sjekkliste li{display:flex; gap:10px; align-items:flex-start}
  .sjekkliste input[type="checkbox"]{width:20px; height:20px; margin-top:2px; accent-color:var(--gronn)}
  .epost{font-family:"Courier New",monospace; font-size:14px; background:var(--panel); padding:2px 6px; border-radius:6px; word-break:break-all}

  /* Bunnlinje */
  .bunnlinje{position:fixed; left:0; right:0; bottom:0; background:var(--navy2); color:var(--hvit); padding:12px 20px;
    box-shadow:0 -4px 14px rgba(15,25,40,.25); display:none}
  body.visbunn .bunnlinje{display:block}
  .bunnwrap{max-width:900px; margin:0 auto; display:flex; gap:8px 26px; align-items:center; flex-wrap:wrap}
  .bunnwrap .post{font-size:13px; color:#B9C7D8}
  .bunnwrap .post .tall{display:block; font-size:19px; font-weight:700; color:var(--hvit)}
  .pill{margin-left:auto; padding:8px 16px; border-radius:99px; font-weight:700; font-size:15px}
  .pill.gronn{background:var(--gronn)} .pill.rod{background:var(--rod)} .pill.noytral{background:#3D5573}

  /* Eksport */
  .eksportknapp{background:var(--navy); color:var(--hvit); border:none; padding:14px 22px; font-size:17px; font-weight:700}
  .eksportknapp:hover{background:#28497A}
  .ark{background:var(--hvit); border:1px solid var(--strek); border-radius:8px; padding:34px 38px; margin-top:16px}
  .ark h2{font-size:24px; color:var(--navy)}
  .ark h3{font-size:16px; color:var(--navy); margin:22px 0 8px; text-transform:uppercase; letter-spacing:.05em}
  .ark .topplinje{color:var(--gra); font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin:0 0 4px}
  .ark .metaliste{margin:10px 0 0; color:var(--gra); font-size:14.5px; display:flex; flex-wrap:wrap; gap:4px 22px; padding:0; list-style:none}
  .ark table{width:100%; border-collapse:collapse; font-size:14.5px}
  .ark th{Text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--gra);
    border-bottom:2px solid var(--navy); padding:6px 8px}
  .ark th.h{text-align:right}
  .ark td{border-bottom:1px solid #E4E9F1; padding:7px 8px; vertical-align:top}
  .ark td.h{text-align:right; white-space:nowrap}
  .ark tr.sum td{font-weight:700; border-top:2px solid var(--navy); border-bottom:none}
  .ark tr.seksjon td{font-weight:700; color:var(--navy); border-bottom:none; padding-top:16px}
  .ark .resboks{margin-top:14px; padding:12px 14px; border-radius:8px; font-weight:700}
  .ark .resboks.gronn{background:var(--gronnlys); color:#1E5238}
  .ark .resboks.rod{background:var(--rodlys); color:#6E2323}
  .ark p.rap{margin:4px 0 12px; white-space:pre-wrap}
  .ark .signaturer{display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:26px}
  .ark .signaturer div{border-top:1px solid var(--blekk); padding-top:6px; font-size:13.5px; color:var(--gra)}
  .ark .fot{margin-top:26px; font-size:12.5px; color:var(--gra)}

  @media print{
    body *{visibility:hidden}
    #trykk, #trykk *{visibility:visible}
    #trykk{position:absolute; top:0; left:0; width:100%; border:none; border-radius:0; padding:0; margin:0}
    .ark table{font-size:12px}
  }
</style>

<header>
  <div class="hwrap">
    <p class="eyebrow">ADHD Norge Øyane lokallag</p>
    <h1>Prosjektlageret</h1>
    <p class="under">Ett sted for hver aktivitet: planlegging, budsjett, regnskap og rapport til styret.</p>
  </div>
</header>

<main id="app"></main>

<div class="bunnlinje">
  <div class="bunnwrap">
    <span class="post">UT<span class="tall" id="b-ut">kr 0</span></span>
    <span class="post">INN<span class="tall" id="b-inn">kr 0</span></span>
    <span class="pill noytral" id="b-pill">Ikke utfylt</span>
  </div>
</div>

<script>
(function(){
  "use strict";
  var LAGER="oyane-prosjektlager-v1", GAMMEL="oyane-budsjettbyggeren-v1";
  var nf=new Intl.NumberFormat("nb-NO",{maximumFractionDigits:2});
  var app=document.getElementById("app");

  function tall(v){
    if(v===null||v===undefined) return 0;
    var s=String(v).replace(/\s/g,"").replace(",",".");
    var n=parseFloat(s);
    return isNaN(n)?0:n;
  }
  function kr(n){ return "kr "+nf.format(Math.round(n*100)/100); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function nyttProsjekt(){
    return {
      id: "p"+Date.now()+Math.floor(Math.random()*1000),
      navn:"", dato:"", sted:"", ansvarlig:"", prosjektnr:"", beskrivelse:"",
      huskeliste:[],
      ut:[{t:"",b:"",f:""}],
      leder:{aktiv:false, linjer:[{t:"",b:"",f:""}]},
      egen:{antall:"",sats:"",faktisk:""},
      tilskudd:[{t:"",b:"",ja:false,f:""}],
      inn:[],
      rapport:{gjorde:"",deltok:"",laerte:""},
      sjekk:{s1:false,s2:false,s3:false,s4:false},
      godkjenning:{dato:"",vedtak:""}
    };
  }

  var state={prosjekter:[]};

  function lagre(){ try{ localStorage.setItem(LAGER, JSON.stringify(state)); }catch(e){} }
  function lastInn(){
    try{
      var raw=localStorage.getItem(LAGER);
      if(raw){ var s=JSON.parse(raw); if(s && s.prosjekter) state=s; return; }
      // Migrer fra gamle Budsjettbyggeren
      var g=localStorage.getItem(GAMMEL);
      if(g){
        var v=JSON.parse(g), p=nyttProsjekt();
        if(v.info){ p.navn=v.info.navn||""; p.dato=v.info.dato||""; p.ansvarlig=v.info.ansvarlig||""; p.prosjektnr=v.info.prosjekt||""; }
        if(v.ut) p.ut=v.ut;
        if(v.leder) p.leder=v.leder;
        if(v.egen) p.egen=v.egen;
        if(v.tilskudd) p.tilskudd=v.tilskudd;
        if(v.inn) p.inn=v.inn;
        if(v.sjekk) p.sjekk=v.sjekk;
        if(v.godkjenning) p.godkjenning=v.godkjenning;
        var harNoe=p.navn || p.ut.some(function(r){return r.t||r.b;}) || tall(p.egen.antall)>0;
        if(harNoe){ state.prosjekter.push(p); lagre(); }
      }
    }catch(e){}
  }

  /* ---------- summer ---------- */
  function sumListe(l,felt){ return l.reduce(function(a,r){return a+tall(r[felt]);},0); }
  function sumUt(p,felt){ return sumListe(p.ut,felt)+(p.leder.aktiv?sumListe(p.leder.linjer,felt):0); }
  function egenB(p){ return tall(p.egen.antall)*tall(p.egen.sats); }
  function tilB(p){ return p.tilskudd.reduce(function(a,r){return a+(r.ja?tall(r.b):0);},0); }
  function tilVenter(p){ return p.tilskudd.reduce(function(a,r){return a+(r.ja?0:tall(r.b));},0); }
  function sumInn(p){ return egenB(p)+tilB(p)+sumListe(p.inn,"b"); }
  function sumInnF(p){ return tall(p.egen.faktisk)+sumListe(p.tilskudd,"f")+sumListe(p.inn,"f"); }
  function erTom(p){ return sumUt(p,"b")===0 && sumInn(p)===0; }

  /* ---------- felles smaakomponenter ---------- */
  function bindFelt(el, obj, felt, etterpaa){
    el.value=obj[felt]||"";
    el.addEventListener("input",function(){ obj[felt]=el.value; if(etterpaa) etterpaa(); lagre(); });
  }
  function lagLinje(p, liste, i, rad, tegnOm){
    var d=document.createElement("div");
    d.className="linje";
    d.innerHTML='<input type="text" class="tekst" placeholder="Hva gjelder det?">'+
      '<input type="text" class="belop" inputmode="decimal" placeholder="0">'+
      '<button class="slett" title="Fjern linjen" aria-label="Fjern linjen">&times;</button>';
    var t=d.querySelector(".tekst"), b=d.querySelector(".belop");
    t.value=rad.t; b.value=rad.b;
    t.addEventListener("input",function(){ rad.t=t.value; lagre(); });
    b.addEventListener("input",function(){ rad.b=b.value; oppdaterBudsjettSummer(p); lagre(); });
    d.querySelector(".slett").addEventListener("click",function(){ liste.splice(i,1); tegnOm(); lagre(); });
    return d;
  }

  /* ---------- FORSIDEN ---------- */
  function visHjem(){
    document.body.className="";
    var html='<button class="nyprosjekt" id="nytt">+ Opprett prosjekt</button>';
    if(state.prosjekter.length===0){
      html+='<div class="tomt">Ingen prosjekter ennå. Trykk på knappen over for å planlegge den første aktiviteten.</div>';
    } else {
      html+='<div class="prosjektgrid" id="pgrid"></div>';
    }
    app.innerHTML=html;
    document.getElementById("nytt").addEventListener("click",function(){
      var p=nyttProsjekt();
      state.prosjekter.unshift(p);
      lagre();
      visProsjekt(p.id,"plan",true);
    });
    var grid=document.getElementById("pgrid");
    if(!grid) return;
    state.prosjekter.forEach(function(p){
      var res=sumInn(p)-sumUt(p,"b");
      var spill, spillKl;
      if(erTom(p)){ spill="Ikke utfylt"; spillKl="noytral"; }
      else if(res>=0){ spill=(res===0?"I null":"+ "+nf.format(res)+" kr"); spillKl="gronn"; }
      else { spill="Mangler "+nf.format(-res)+" kr"; spillKl="rod"; }
      var d=document.createElement("div");
      d.className="pkort";
      d.setAttribute("role","button");
      d.tabIndex=0;
      d.innerHTML='<h3>'+ (esc(p.navn)||'<span style="color:#A6B1BF">Uten navn</span>') +'</h3>'+
        '<div class="meta">'+ (esc(p.dato)||"Dato ikke satt") + (p.prosjektnr? " &middot; Prosjekt "+esc(p.prosjektnr):"") +'</div>'+
        '<div class="rad2"><span class="meta tall">UT '+kr(sumUt(p,"b"))+' &middot; INN '+kr(sumInn(p))+'</span>'+
        '<span class="spill '+spillKl+'">'+spill+'</span></div>'+
        '<div style="text-align:right"><button class="pslett">Slett</button></div>';
      function aapne(){ visProsjekt(p.id,"plan"); }
      d.addEventListener("click",function(e){ if(!e.target.closest(".pslett")) aapne(); });
      d.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); aapne(); } });
      var slett=d.querySelector(".pslett"), klar=false, timer=null;
      slett.addEventListener("click",function(){
        if(!klar){ klar=true; slett.textContent="Sikker? Trykk igjen"; slett.style.color="#A63A3A";
          timer=setTimeout(function(){ klar=false; slett.textContent="Slett"; slett.style.color=""; },4000);
          return; }
        clearTimeout(timer);
        state.prosjekter=state.prosjekter.filter(function(x){return x.id!==p.id;});
        lagre(); visHjem();
      });
      grid.appendChild(d);
    });
  }

  /* ---------- PROSJEKTVISNING ---------- */
  var TABS=[["plan","Planlegging"],["budsjett","Budsjett"],["rapport","Rapport"],["eksport","Eksport"]];

  function visProsjekt(id, tab, fokusNavn){
    var p=state.prosjekter.find(function(x){return x.id===id;});
    if(!p){ visHjem(); return; }
    document.body.className = tab==="budsjett" ? "visbunn" : "";
    var tabsHtml=TABS.map(function(t){
      return '<button data-tab="'+t[0]+'" class="'+(t[0]===tab?"aktiv":"")+'">'+t[1]+"</button>";
    }).join("");
    app.innerHTML=
      '<div class="prosjekttopp">'+
        '<button class="tilbake" id="tilbake">&larr; Alle prosjekter</button>'+
        '<input class="navnfelt" id="p-navn" type="text" placeholder="Gi prosjektet et navn">'+
        '<div class="tabbar" id="tabbar">'+tabsHtml+'</div>'+
      '</div>'+
      '<div id="pane"></div>';

    function tegnUt(){

      var m=document.getElementById("inn-linjer"); m.innerHTML="";
      p.inn.forEach(function(r,i){ m.appendChild(lagLinje(p,p.inn,i,r,function(){ tegnInn(); oppdaterBudsjettSummer(p); })); });
    }
    function tegnTilskudd(){
      var m=document.getElementById("tilskudd-linjer"); m.innerHTML="";
      p.tilskudd.forEach(function(rad,i){
        var d=document.createElement("div");
        d.className="tilskuddrad"+(rad.ja?"":" venter");
        d.innerHTML='<input type="text" class="tekst" placeholder="F.eks. Frifond, kommunen, fylkeslaget">'+

  function oppdaterBudsjettSummer(p){
    var utB=sumUt(p,"b"), innB=sumInn(p), venter=tilVenter(p), res=innB-utB;
    var sett=function(id,v){ var el=document.getElementById(id); if(el) el.textContent=v; };
    sett("egen-sum","= "+kr(egenB(p)));
    sett("sum-ut",kr(utB));
    sett("sum-inn",kr(innB)+(venter>0?"  (+ "+kr(venter)+" venter på svar)":""));
    sett("r-inn",kr(innB)); sett("r-ut",kr(utB)); sett("r-res",kr(res));
    var boks=document.getElementById("statusboks"), pill=document.getElementById("b-pill");
    if(boks){
      if(utB===0 && innB===0){
        boks.className="status noytral";
        boks.innerHTML="Fyll inn tallene i steg 1 og 2, så ser du svaret her.";
      } else if(res>=0){
        boks.className="status gronn";
        boks.innerHTML="<b>Budsjettet går i "+(res===0?"null":"pluss med "+kr(res))+".</b> Klart til å sendes styret for godkjenning."+(venter>0?" Husk: "+kr(venter)+" i tilskudd venter fortsatt på svar og er ikke regnet med.":"");
      } else {
        var mangler=-res, antall=tall(p.egen.antall);
        var perDeltaker=antall>0?" Det er ca. "+kr(Math.ceil(mangler/antall))+" mer per deltaker.":"";
        boks.className="status rod";
        boks.innerHTML="<b>Budsjettet mangler "+kr(mangler)+".</b>"+perDeltaker+
          '<div class="treknapper">'+
          '<div><b>1. Øk egenandelen</b>Litt høyere egenandel kan være nok til å tette hullet.</div>'+
          '<div><b>2. Krymp en utgift</b>Finn den største posten i steg 1 - går det an å gjøre det billigere?</div>'+
          '<div><b>3. Spør styret</b>Kanskje finnes det tilskudd å søke, eller styret kan vedta å dekke mellomlegget.</div>'+
          "</div>";
      }
    }
    if(pill){
      if(utB===0 && innB===0){ pill.className="pill noytral"; pill.textContent="Ikke utfylt"; }
      else if(res>=0){ pill.className="pill gronn"; pill.textContent=(res===0?"I null":"+ "+nf.format(res)+" kr"); }
      else { pill.className="pill rod"; pill.textContent="&minus; "; pill.textContent="− "+nf.format(-res)+" kr"; }
      var bu=document.getElementById("b-ut"), bi=document.getElementById("b-inn");
      if(bu) bu.textContent=kr(utB);
      if(bi) bi.textContent=kr(innB);
    }
  }

  /* ---------- TAB: RAPPORT ---------- */
  function radHarInnhold(r){ return (r.t&&r.t.trim()) || tall(r.b)>0 || tall(r.f)>0; }

  function tegnRapport(p,pane){
    pane.innerHTML=
      '<div style="display:flex;flex-direction:column;gap:20px;margin-top:18px">'+
      '<section class="kort"><h2 style="font-size:20px">Hva ble det egentlig?</h2>'+
      '<p class="stegintro">Fyll inn de faktiske tallene fra kvitteringene ved siden av budsjettet. Dette blir aktivitetsregnskapet.</p>'+
      '<h3 style="font-size:16px">Penger UT</h3>'+
      '<div class="rhode"><span>Post</span><span>Budsjett</span><span>Faktisk</span></div>'+
      '<div class="linjer" id="r-ut-linjer"></div>'+
      '<h3 style="font-size:16px; margin-top:20px">Penger INN</h3>'+
      '<div class="rhode"><span>Post</span><span>Budsjett</span><span>Faktisk</span></div>'+
      '<div class="linjer" id="r-inn-linjer"></div>'+
      '<div class="sumlinje"><span>Faktisk resultat</span><span class="tall" id="rf-res">kr 0</span></div>'+

      '</section>'+
      '<section class="kort"><h2 style="font-size:20px">Kort rapport til styret</h2>'+
      '<p class="stegintro">Tre spørsmål er nok. Rapport og regnskap gjennomgås på neste styremøte - det er slik vi lærer til neste gang.</p>'+
      '<label class="felt">Hva gjorde vi?<textarea id="rap-gjorde" placeholder="Kort om hvordan aktiviteten gikk."></textarea></label>'+
      '<label class="felt" style="margin-top:12px">Hvor mange deltok?<input type="text" id="rap-deltok" placeholder="F.eks. 18 medlemmer + 4 frivillige"></label>'+
      '<label class="felt" style="margin-top:12px">Hva lærte vi? Tips til neste gang?<textarea id="rap-laerte" placeholder="Hva funket, hva ville du gjort annerledes?"></textarea></label>'+
      '</section>'+
      '<section class="kort"><h2 style="font-size:20px">Før styremøtet</h2>'+
      '<ul class="sjekkliste">'+
        '<li><input type="checkbox" id="s1"><label for="s1">Alle kvitteringer er sendt til kvitteringsmailen (adressen får du av økonomiansvarlig) - merket med prosjektnummeret</label></li>'+
        '<li><input type="checkbox" id="s2"><label for="s2">Faktisk-kolonnen er fylt ut, og jeg kan forklare de største avvikene fra budsjettet</label></li>'+
        '<li><input type="checkbox" id="s3"><label for="s3">Kort rapport er skrevet: hva gjorde vi, hvor mange deltok, hva lærte vi</label></li>'+
        '<li><input type="checkbox" id="s4"><label for="s4">Rapport og regnskap er sendt til styret før neste styremøte</label></li>'+
      '</ul></section></div>';

    function oppdaterFaktisk(){
      var utF=sumUt(p,"f"), innF=sumInnF(p), resF=innF-utF;
      document.getElementById("rf-res").textContent=kr(resF);
      var st=document.getElementById("rf-status");
      if(utF===0 && innF===0){ st.className="status noytral"; st.textContent="Faktiske tall er ikke fylt inn ennå."; }
      else if(resF>=0){ st.className="status gronn"; st.innerHTML="<b>Regnskapet går i "+(resF===0?"null":"pluss med "+kr(resF))+".</b> Bra jobbet - klart for styret."; }
      else { st.className="status rod"; st.innerHTML="<b>Regnskapet går i minus med "+kr(-resF)+".</b> Skriv en kort forklaring på avviket i rapporten under - det er helt greit, styret vil bare forstå hvorfor."; }
    }
    function fRad(mount, tekst, budsjett, obj, felt){
      var d=document.createElement("div");
      d.className="rrad";
      d.innerHTML='<span class="rtekst"></span><span class="rbud tall"></span><input type="text" inputmode="decimal" placeholder="0">';
      d.querySelector(".rtekst").textContent=tekst;
      d.querySelector(".rbud").textContent=kr(budsjett);

    utRader.forEach(function(r){ fRad(mu, r.t||"(uten navn)", tall(r.b), r, "f"); });
    if(p.leder.aktiv) p.leder.linjer.filter(radHarInnhold).forEach(function(r){

    fRad(mi,"Egenandeler ("+(p.egen.antall||"0")+" x "+(p.egen.sats||"0")+")", egenB(p), p.egen, "faktisk");
    p.tilskudd.filter(radHarInnhold).forEach(function(r){
      fRad(mi,(r.t||"Tilskudd")+(r.ja?"":" (ventet på svar)"), r.ja?tall(r.b):0, r, "f");
    });
    p.inn.filter(radHarInnhold).forEach(function(r){ fRad(mi, r.t||"(uten navn)", tall(r.b), r, "f"); });

    bindFelt(document.getElementById("rap-gjorde"),p.rapport,"gjorde");

    bindFelt(document.getElementById("rap-laerte"),p.rapport,"laerte");
    ["s1","s2","s3","s4"].forEach(function(id){
      var el=document.getElementById(id);
      el.checked=!!p.sjekk[id];
      el.addEventListener("change",function(){ p.sjekk[id]=el.checked; lagre(); });
    });
    oppdaterFaktisk();
  }

  /* ---------- TAB: EKSPORT ---------- */
  function avvik(b,f){ var d=f-b; return (d>0?"+":"")+nf.format(Math.round(d*100)/100); }
  function tegnEksport(p,pane){
    var utB=sumUt(p,"b"), utF=sumUt(p,"f"), innB=sumInn(p), innF=sumInnF(p);
    var resB=innB-utB, resF=innF-utF;
    var rader="";
    function rad(t,b,f,note){
      rader+="<tr><td>"+esc(t)+(note?' <span style="color:#5A6472;font-size:12.5px">'+esc(note)+"</span>":"")+"</td>"+
        '<td class="h tall">'+kr(b)+'</td><td class="h tall">'+kr(f)+'</td><td class="h tall">'+avvik(b,f)+"</td></tr>";
    }
    rader+='<tr class="seksjon"><td colspan="4">Penger UT</td></tr>';
    p.ut.filter(radHarInnhold).forEach(function(r){ rad(r.t||"(uten navn)", tall(r.b), tall(r.f)); });
    if(p.leder.aktiv) p.leder.linjer.filter(radHarInnhold).forEach(function(r){
      rad(r.t||"(uten navn)", tall(r.b), tall(r.f), "(forhåndsgodkjent post for aktivitetsleder)");
    });
    rader+='<tr class="sum"><td>Sum penger UT</td><td class="h tall">'+kr(utB)+'</td><td class="h tall">'+kr(utF)+'</td><td class="h tall">'+avvik(utB,utF)+"</td></tr>";
    rader+='<tr class="seksjon"><td colspan="4">Penger INN</td></tr>';
    rad("Egenandeler ("+(p.egen.antall||"0")+" x "+(p.egen.sats||"0")+")", egenB(p), tall(p.egen.faktisk));
    p.tilskudd.filter(radHarInnhold).forEach(function(r){
      rad(r.t||"Tilskudd", r.ja?tall(r.b):0, tall(r.f), r.ja?"":"(ikke bekreftet i budsjettet)");
    });
    p.inn.filter(radHarInnhold).forEach(function(r){ rad(r.t||"(uten navn)", tall(r.b), tall(r.f)); });
    rader+='<tr class="sum"><td>Sum penger INN</td><td class="h tall">'+kr(innB)+'</td><td class="h tall">'+kr(innF)+'</td><td class="h tall">'+avvik(innB,innF)+"</td></tr>";

    pane.innerHTML=
      '<div style="margin-top:18px">'+
      '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+
      '<button class="eksportknapp" id="skrivut">Skriv ut / lagre som PDF</button>'+
      '<span style="color:var(--gra);font-size:14px">Dette arket legges ved styrepapirene. Forhåndsvisningen under viser nøyaktig det som skrives ut.</span></div>'+
      '<div class="ark" id="trykk">'+
        '<p class="topplinje">ADHD Norge Øyane lokallag - aktivitetsregnskap og sluttrapport</p>'+
        '<h2>'+(esc(p.navn)||"(uten navn)")+"</h2>"+
        '<ul class="metaliste">'+
          "<li><b>Dato:</b> "+(esc(p.dato)||"-")+"</li>"+
          "<li><b>Sted:</b> "+(esc(p.sted)||"-")+"</li>"+
          "<li><b>Ansvarlig:</b> "+(esc(p.ansvarlig)||"-")+"</li>"+
          "<li><b>Prosjektnummer:</b> "+(esc(p.prosjektnr)||"-")+"</li>"+
        "</ul>"+
        (p.beskrivelse?'<h3>Om aktiviteten</h3><p class="rap">'+esc(p.beskrivelse)+"</p>":"")+
        "<h3>Regnskap</h3>"+
        '<table><thead><tr><th>Post</th><th class="h">Budsjett</th><th class="h">Faktisk</th><th class="h">Avvik</th></tr></thead><tbody>'+rader+"</tbody></table>"+
        '<div class="resboks '+(resF>=0?"gronn":"rod")+'">Resultat: budsjett '+kr(resB)+" &middot; faktisk "+kr(resF)+"</div>"+
        "<h3>Rapport</h3>"+
        "<p class=\"rap\"><b>Hva gjorde vi?</b><br>"+(esc(p.rapport.gjorde)||"-")+"</p>"+
        "<p class=\"rap\"><b>Hvor mange deltok?</b><br>"+(esc(p.rapport.deltok)||"-")+"</p>"+
        "<p class=\"rap\"><b>Hva lærte vi?</b><br>"+(esc(p.rapport.laerte)||"-")+"</p>"+
        "<h3>Behandling i styret</h3>"+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
          '<label class="felt">Behandlet i styremøte (dato)<input type="text" id="g-dato"></label>'+
          '<label class="felt">Vedtak / merknader<input type="text" id="g-vedtak"></label>'+
        "</div>"+
        '<div class="signaturer"><div>Aktivitetsansvarlig</div><div>For styret</div></div>'+
        '<p class="fot">Alle kvitteringer er sendt til kvitteringsmailen merket med prosjektnummer '+(esc(p.prosjektnr)||"-")+". Rapport og regnskap gjennomgås på neste styremøte.</p>"+
      "</div></div>";
    bindFelt(document.getElementById("g-dato"),p.godkjenning,"dato");
    bindFelt(document.getElementById("g-vedtak"),p.godkjenning,"vedtak");
    document.getElementById("skrivut").addEventListener("click",function(){ window.print(); });
  }

  /* ---------- oppstart ---------- */
  lastInn();
  visHjem();
})();
</script>
