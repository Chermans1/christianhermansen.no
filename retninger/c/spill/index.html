  'Q': '.#####..|##...##.|##...##.|##...##.|##.#.##.|##..##..|.####.#.|........',
  'R': '######..|##...##.|##...##.|######..|##.##...|##..##..|##...##.|........',
  'S': '.#####..|##...##.|##......|.#####..|.....##.|##...##.|.#####..|........',
  'T': '#######.|...#....|...#....|...#....|...#....|...#....|...#....|........',

const FONT = {};
for (const [t, rå] of Object.entries(FONT_RÅ)) {
  FONT[t] = rå.split('|').map(rad => { let b = 0; for (let x = 0; x < 8; x++) if (rad[x] === '#') b |= 0x80 >> x; return b; });
}
const glyf = t => FONT[t] || FONT['?'];

/* =====================================================================
   FRAMEBUFFER
   ===================================================================== */

const W = Math.round(384 / ZOOM), H = Math.round(272 / ZOOM);
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const bilde = ctx.createImageData(W, H);
const fb = new Uint32Array(bilde.data.buffer);

const rgb = (r, g, b) => (255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
const hex = h => rgb((h >> 16) & 255, (h >> 8) & 255, h & 255);
const PAL = C64.map(hex);
const blendHex = (a, b, t) => rgb(
  Math.round(((a >> 16) & 255) * (1 - t) + ((b >> 16) & 255) * t),
  Math.round(((a >> 8) & 255) * (1 - t) + ((b >> 8) & 255) * t),
  Math.round((a & 255) * (1 - t) + (b & 255) * t),
);

function fyll(f) { fb.fill(f); }
function boks(x, y, w, h, f) {
  const x0 = Math.max(0, x | 0), x1 = Math.min(W, (x + w) | 0);
  const y0 = Math.max(0, y | 0), y1 = Math.min(H, (y + h) | 0);
  for (let yy = y0; yy < y1; yy++) fb.fill(f, yy * W + x0, yy * W + x1);
}
function piksel(x, y, f) { if (x >= 0 && x < W && y >= 0 && y < H) fb[y * W + x] = f; }
function ramme(x, y, w, h, f) { boks(x, y, w, 1, f); boks(x, y + h - 1, w, 1, f); boks(x, y, 1, h, f); boks(x + w - 1, y, 1, h, f); }
// Lysner pikselen som allerede ligger der (t = 0..1 mot hvitt)
function lysne(x, y, t) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const p = fb[y * W + x], r = p & 255, g = (p >> 8) & 255, b = (p >> 16) & 255;
  fb[y * W + x] = rgb(r + (255 - r) * t, g + (255 - g) * t, b + (255 - b) * t);
}
function tegn(t, x, y, skala, f) {
  const g = glyf(t);
  for (let rad = 0; rad < 8; rad++) {
    const bits = g[rad]; if (!bits) continue;
    for (let kol = 0; kol < 8; kol++) if (bits & (0x80 >> kol)) boks(x + kol * skala, y + rad * skala, skala, skala, f);
  }
}
function tekst(s, x, y, skala, f) { for (let i = 0; i < s.length; i++) tegn(s[i], x + i * 8 * skala, y, skala, f); }
function tekstMidt(s, cx, y, skala, f) { tekst(s, cx - s.length * 4 * skala, y, skala, f); }
function tekstMedSkygge(s, x, y, skala, f) { tekst(s, x + 1, y + 1, skala, PAL[SVART]); tekst(s, x, y, skala, f); }

// Pikselkunst fra tekst: hver bokstav er en farge, punktum er gjennomsiktig (0)
function bilde2d(rader) {
  const h = rader.length, w = rader[0].length, px = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = rader[y][x];
    px[y * w + x] = c === '.' ? 0 : PAL[FARGEBOKSTAV[c]];
  }
  return { w, h, px };
}
function speil(b) {
  const px = new Uint32Array(b.w * b.h);
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) px[y * b.w + x] = b.px[y * b.w + (b.w - 1 - x)];
  return { w: b.w, h: b.h, px };
}
function blit(b, x, y) {
  x |= 0; y |= 0;
  for (let yy = 0; yy < b.h; yy++) {
    const sy = y + yy; if (sy < 0 || sy >= H) continue;
    for (let xx = 0; xx < b.w; xx++) {
      const sx = x + xx; if (sx < 0 || sx >= W) continue;
      const f = b.px[yy * b.w + xx]; if (f) fb[sy * W + sx] = f;
    }
  }
}

function skaler() {
  let s = Math.min(innerWidth / W, innerHeight / H);
  if (HELE_PIKSLER) s = Math.max(1, Math.floor(s));
  canvas.style.width = Math.floor(W * s) + 'px'; canvas.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', skaler); skaler();

// Hoppet: armene opp
{

// Leser et PNG-ark med rammer på rad inn som framebuffer-bilder, pluss speilvendt kopi.
// Sett speilet = true hvis arket er tegnet vendt mot venstre (da blir 'h' den speilede).
function lastArk(src, bw, bh, speilet = false) {
  const ark = { klar: false, rammer: [] };
  const bilde = new Image();
  bilde.onload = () => {
    const c = document.createElement('canvas'); c.width = bilde.width; c.height = bilde.height;
    const g = c.getContext('2d'); g.drawImage(bilde, 0, 0);
    const d = new Uint32Array(g.getImageData(0, 0, c.width, c.height).data.buffer);
    for (let i = 0; i < bilde.width / bw; i++) {
      const px = new Uint32Array(bw * bh);
      for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
        const p = d[y * bilde.width + i * bw + x];
        px[y * bw + x] = (p >>> 24) ? (p | 0xFF000000) : 0;   // gjennomsiktig = 0
      }
      const b = { w: bw, h: bh, px };
      ark.rammer.push(speilet ? { v: b, h: speil(b) } : { h: b, v: speil(b) });
    }
    ark.klar = true;
  };
  bilde.src = src;
  return ark;
}
const ARK = BRUK_ARK ? lastArk(ARK_DATA, ARK_RAMME, ARK_RAMME) : { klar: false, rammer: [] };

// Døra: 16x32, lukket og åpen
function lagDør(åpen) {
  const rader = [];
  for (let y = 0; y < 32; y++) {
    let r = '';
    for (let x = 0; x < 16; x++) {
      const kant = x === 0 || x === 15 || y === 0;
      if (kant) r += 'n';
      else if (åpen) r += (y > 26 && x > 3 && x < 12) ? 'y' : (x === 1 || x === 14 || y === 1) ? 'o' : 'k';
      else r += (x === 10 && y === 17) ? 'y' : (x % 5 === 0 || y === 16) ? 'n' : 'o';
    }
    rader.push(r);
  }
  return bilde2d(rader);
}
const DØR = { lukket: lagDør(false), åpen: lagDør(true) };

// Fliser 16x16
function lagFlis(fn) {
  const px = new Uint32Array(T * T);
  for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) px[y * T + x] = fn(x, y);
  return { w: T, h: T, px };
}
const FLIS = {
  '#': lagFlis((x, y) => {
    const rad = Math.floor(y / 8), fuge = y % 8 === 7 || ((x + rad * 8) % 16 === 15);
    const lys = y % 8 === 0 || ((x + rad * 8) % 16 === 0);
    return fuge ? PAL[SVART] : lys ? PAL[GRÅ2] : PAL[GRÅ1];
  }),
  'c': lagFlis((x, y) => {
    const kant = x === 0 || y === 0 || x === 15 || y === 15;
    const diag = x === y || x === 15 - y;
    return kant || diag ? PAL[BRUN] : (x === 1 || y === 1) ? blendHex(0x6F4F25, 0xFFFFFF, 0.25) : PAL[ORANSJE];
  }),
  '=': lagFlis((x, y) => y >= 6 ? 0 : y === 0 ? blendHex(0x6F4F25, 0xFFFFFF, 0.3) : y === 5 || x % 8 === 7 ? PAL[BRUN] : PAL[ORANSJE]),
  '^': lagFlis((x, y) => {
    const s = x % 4, topp = 16 - (s === 1 || s === 2 ? 8 : 4);
    return y >= topp ? (s === 1 ? PAL[HVIT] : PAL[GRÅ3]) : 0;
  }),
};
// Bakvegg med parallakse: mørkere murstein
const BAKVEGG = lagFlis((x, y) => {
  const rad = Math.floor(y / 8), fuge = y % 8 === 7 || ((x + rad * 8) % 16 === 15);
  return fuge ? hex(0x0c0a14) : hex(0x181228);
});

/* =====================================================================
   MUSIKK - egen låt i D-moll, samme motor som cracktroen
   ===================================================================== */

const NOTE = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const midi = navn => 12 * (parseInt(navn.slice(-1)) + 1) + NOTE[navn.slice(0, -1)];
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

const AKKORDER = [
  ['D4', 'F4', 'A4'], ['A#3', 'D4', 'F4'], ['F4', 'A4', 'C5'], ['C4', 'E4', 'G4'],
  ['D4', 'F4', 'A4'], ['A#3', 'D4', 'F4'], ['C4', 'E4', 'G4'], ['A3', 'C#4', 'E4'],
].map(a => a.map(midi));
const BASS_ROT = ['D2', 'A#1', 'F2', 'C2', 'D2', 'A#1', 'C2', 'A1'].map(midi);
const BASS_MØNSTER = [0, 0, 12, 0, 0, 12, 0, 0, 0, 0, 12, 0, 0, 12, 0, 12];
const MELODI = [
  'D5 -- F5 -- A5 == G5 F5', 'F5 -- D5 -- A#4 == == --',
  'C5 -- A4 -- F5 == E5 D5', 'E5 -- C5 -- G5 == == --',
  'A5 == F5 -- D5 -- F5 --', 'A#5 == G5 -- F5 -- D5 --',
  'E5 F5 G5 -- E5 -- C5 --', 'C#5 == E5 -- A4 == == --',
].map(takt => {
  const h = [];
  takt.split(' ').forEach((t, i) => {
    if (t === '--') return;
    if (t === '==') { if (h.length) h[h.length - 1].lengde += 2; return; }
    h.push({ steg: i * 2, note: midi(t), lengde: 2 });
  });
  return h;
});

const Musikk = {
  ctx: null, master: null, støy: null, timer: null, steg: 0, nesteTid: 0, dempet: false, aktiv: false,
  stegVarighet: 60 / BPM / 4,
  start() {
    if (this.ctx) { this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.45; this.master.connect(this.ctx.destination);
    const n = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, n, n), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.støy = buf;
    this.timer = setInterval(() => this.planlegg(), 25);
  },
  spill(på) {
    if (!this.ctx) return;
    if (på && !this.aktiv) { this.steg = 0; this.nesteTid = this.ctx.currentTime + 0.05; }
    this.aktiv = på;
  },
  planlegg() {
    if (!this.aktiv) return;
    while (this.nesteTid < this.ctx.currentTime + 0.12) { this.spillSteg(this.steg, this.nesteTid); this.nesteTid += this.stegVarighet; this.steg++; }
  },
  spillSteg(steg, t) {
    const takt = Math.floor(steg / 16) % 8, i = steg % 16, dur = this.stegVarighet;
    this.tone('triangle', hz(BASS_ROT[takt] + BASS_MØNSTER[i]), t, dur * 0.8, 0.26, 0.01);
    const akk = AKKORDER[takt], o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square';
    for (let k = 0; k < 3; k++) o.frequency.setValueAtTime(hz(akk[k] + 12), t + k * dur / 3);
    g.gain.setValueAtTime(i % 4 === 0 ? 0.07 : 0.045, t); g.gain.linearRampToValueAtTime(0.02, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur);
    for (const h of MELODI[takt]) if (h.steg === i) this.lead(hz(h.note), t, h.lengde * dur);
    if (i === 0 || i === 8 || i === 10) this.kick(t);
    if (i === 4 || i === 12) this.snare(t);
    if (i % 2 === 0) this.hihat(t, i % 4 === 2 ? 0.07 : 0.03);
  },
  tone(type, f, t, dur, vol, attakk) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attakk);
    g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.01);
  },
  lead(f, t, dur) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), lfo = this.ctx.createOscillator(), lfoG = this.ctx.createGain();
    o.type = 'square'; o.frequency.value = f; lfo.frequency.value = 5.5; lfoG.gain.value = f * 0.006;
    lfo.connect(lfoG).connect(o.frequency);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.13, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.09);
    g.gain.setValueAtTime(0.075, t + dur - 0.03); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(this.master); o.start(t); lfo.start(t); o.stop(t + dur + 0.01); lfo.stop(t + dur + 0.01);
  },
  kick(t) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.11);
    g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + 0.16);
  },
  støyBit(t, dur, type, freq, vol) {
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.støy; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(this.master); s.start(t); s.stop(t + dur);
  },
  snare(t) { this.støyBit(t, 0.12, 'bandpass', 1800, 0.4); this.tone('sine', 190, t, 0.07, 0.35, 0.002); },
  hihat(t, dur) { this.støyBit(t, dur, 'highpass', 7000, 0.18); },
  fx(sekvens, type = 'square', vol = 0.12) {
    if (!this.ctx) return;
    let t = this.ctx.currentTime;
    for (const [f, dur] of sekvens) { this.tone(type, f, t, dur, vol, 0.003); t += dur; }
  },
  glid(f0, f1, dur, type = 'square', vol = 0.12) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.01);
  },
  lydHopp()   { this.glid(220, 660, 0.12, 'square', 0.1); },
  lydPlate()  { this.fx([[880, 0.05], [1175, 0.05], [1760, 0.1]], 'square', 0.12); },
  lydTråkk()  { this.glid(400, 80, 0.15, 'square', 0.14); },
  lydDød()    { this.fx([[440, 0.12], [370, 0.12], [311, 0.12], [262, 0.3]], 'square', 0.14); },
  lydDør()    { this.fx([[523, 0.08], [659, 0.08], [784, 0.08], [1047, 0.08], [1319, 0.3]], 'square', 0.14); },
  lydÅpne()   { this.fx([[196, 0.1], [262, 0.1], [330, 0.2]], 'triangle', 0.2); },
  lydNivåOpp(){ this.fx([[523, 0.07], [659, 0.07], [784, 0.07], [1047, 0.07], [1319, 0.25]], 'square', 0.14); },
  vekslDemp() {
    if (!this.ctx) return;
    this.dempet = !this.dempet;
    this.master.gain.setTargetAtTime(this.dempet ? 0 : 0.45, this.ctx.currentTime, 0.02);
  },
};

/* =====================================================================
   SPILLTILSTAND OG BRETTLASTING
   ===================================================================== */

const S = {
  fase: 'tittel', brettNr: 0, kart: [], bredde: 0, høyde: 0,
  helt: null, fiender: [], plater: [], bonus: [], dør: null, start: null,
  liv: LIV_START, poeng: 0, topp: 0, platerTotalt: 0, platerTatt: 0,
  kamX: 0, kamY: 0, banner: 0, klokke: 0, faseKlokke: 0, tid: 0,
  taster: {}, hoppTrykket: false,
};
try { S.topp = parseInt(localStorage.getItem(LAGRINGSNØKKEL)) || 0; } catch (e) {}

function lastBrett(nr) {
  const b = BRETT[nr];
  S.brettNr = nr; S.kart = b.kart.map(r => [...r]); S.høyde = S.kart.length; S.bredde = S.kart[0].length;
  S.fiender = []; S.plater = []; S.bonus = []; S.platerTatt = 0; S.dør = null;
  for (let y = 0; y < S.høyde; y++) for (let x = 0; x < S.bredde; x++) {
    const c = S.kart[y][x], px = x * T, py = y * T;
    switch (c) {
      case 'P': S.start = { x: px + 3, y: py }; break;
      case 'o': case 'k': case 'e': case 'v': S.plater.push({ x: px + 4, y: py + 4, type: c, tatt: false }); break;
      case 'w': case 'ø': S.bonus.push({ x: px + 4, y: py + 4, type: c, tatt: false }); break;
      case 'R': S.fiender.push({ type: 'rotte', x: px, y: py + T - (BRUK_ARK ? 11 : 8), w: BRUK_ARK ? 18 : 14, h: BRUK_ARK ? 11 : 8, vx: -40, retning: -1, levende: true }); break;
      case 'S': S.fiender.push({ type: 'edderkopp', x: px + (BRUK_ARK ? 2 : 4), y: py, w: BRUK_ARK ? 12 : 8, h: BRUK_ARK ? 12 : 7, ankerY: py, tilstand: 'venter', vent: 0, levende: true }); break;
      case 'B': S.fiender.push({ type: 'flaggermus', x: px + 3, y: py + 3, w: BRUK_ARK ? 18 : 12, h: BRUK_ARK ? 10 : 6, startX: px + 3, startY: py + 3, våken: false, retning: -1, levende: true }); break;
      case 'D': S.dør = { x: px, y: py - T, åpen: false }; break;
    }
    if ('PokevwøRSBD'.includes(c)) S.kart[y][x] = '.';
  }
  S.platerTotalt = S.plater.length;
  nyHelt();
  S.kamX = Math.max(0, Math.min(S.helt.x - W / 2, S.bredde * T - W));
  S.kamY = Math.max(0, Math.min(S.helt.y - H / 2, S.høyde * T - H));
  S.banner = 2.5;
}

function nyHelt() {
  S.helt = { x: S.start.x, y: S.start.y, w: BRUK_ARK ? 12 : 10, h: BRUK_ARK ? 30 : 15, vx: 0, vy: 0, påBakken: false, retning: 1, coyote: 0, hoppBuffer: 0, anim: 0, død: false };
}

function startSpill() {
  S.liv = LIV_START; S.poeng = 0; S.fase = 'spill'; S.faseKlokke = 0;
  lastBrett(0);
  Musikk.spill(true);
}

/* =====================================================================
   KOLLISJON MOT FLISER
   ===================================================================== */

const flis = (tx, ty) => (ty < 0 || ty >= S.høyde || tx < 0 || tx >= S.bredde) ? '#' : S.kart[ty][tx];
const fast = c => c === '#' || c === 'c' || c === '_';
const enveis = c => c === '=' || c === '-';

// Flytter en boks i x og y hver for seg, og stopper mot faste fliser.
// Planker (=) stopper bare når du kommer ovenfra - det er hele enveis-trikset.
function flyttBoks(e, dx, dy) {
  e.x += dx;
  // Liten epsilon: bunnen på 192.0 står PÅ rad 12, ikke i den. Uten den faller du gjennom gulvet.
  const E = 0.001;
  let x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - E) / T);
  let y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - E) / T);
  for (let ty = y0; ty <= y1; ty++) {
    if (dx > 0 && fast(flis(x1, ty))) { e.x = x1 * T - e.w; e.vx = 0; }
    if (dx < 0 && fast(flis(x0, ty))) { e.x = (x0 + 1) * T; e.vx = 0; }
  }
  const førBunn = e.y + e.h;
  e.y += dy;
  x0 = Math.floor(e.x / T); x1 = Math.floor((e.x + e.w - E) / T);
  y0 = Math.floor(e.y / T); y1 = Math.floor((e.y + e.h - E) / T);
  e.påBakken = false;
  for (let tx = x0; tx <= x1; tx++) {
    if (dy > 0) {
      const c = flis(tx, y1);
      if (fast(c) || (enveis(c) && førBunn <= y1 * T + 0.01)) { e.y = y1 * T - e.h; e.vy = 0; e.påBakken = true; }
    }
    if (dy < 0 && fast(flis(tx, y0))) { e.y = (y0 + 1) * T; e.vy = 0; }
  }
}
function bakkeUnder(e) {
  const ty = Math.floor((e.y + e.h) / T);
  for (let tx = Math.floor(e.x / T); tx <= Math.floor((e.x + e.w - 1) / T); tx++) {
    const c = flis(tx, ty); if (fast(c) || enveis(c)) return true;
  }
  return false;
}
function overlapper(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

/* =====================================================================
   OPPDATERING
   ===================================================================== */

function oppdaterHelt(dt) {
  const h = S.helt, t = S.taster;
  if (h.død) {
    h.vy += TYNGDE * dt; h.y += h.vy * dt;
    return;
  }
  // Sidelengs: akselerer mot ønsket fart, brems ellers
  const ønsket = (t.høyre ? 1 : 0) - (t.venstre ? 1 : 0);
  if (ønsket) { h.vx += ønsket * AKSEL * dt; h.retning = ønsket; }
  else if (h.vx > 0) h.vx = Math.max(0, h.vx - FRIKSJON * dt);
  else if (h.vx < 0) h.vx = Math.min(0, h.vx + FRIKSJON * dt);
  h.vx = Math.max(-GANGFART, Math.min(GANGFART, h.vx));

  // Hopp: coyote-tid og hoppbuffer gjør det tilgivende
  h.coyote = h.påBakken ? COYOTE : Math.max(0, h.coyote - dt);
  h.hoppBuffer = Math.max(0, h.hoppBuffer - dt);
  if (S.hoppTrykket) { h.hoppBuffer = HOPPBUFFER; S.hoppTrykket = false; }
  if (h.hoppBuffer > 0 && h.coyote > 0) {
    h.vy = -HOPP; h.coyote = 0; h.hoppBuffer = 0; h.påBakken = false; Musikk.lydHopp();
  }
  // Slipp knappen tidlig = lavere hopp
  if (!t.hopp && h.vy < -120) h.vy = -120;

  h.vy = Math.min(h.vy + TYNGDE * dt, 420);
  flyttBoks(h, h.vx * dt, h.vy * dt);

  if (h.påBakken && ønsket) h.anim += dt * 10; else if (h.påBakken) h.anim = 0;

  // Pigger: bare nederste del av flisa stikker
  const tyFot = Math.floor((h.y + h.h - 1) / T);
  for (let tx = Math.floor(h.x / T); tx <= Math.floor((h.x + h.w - 1) / T); tx++) {
    if (flis(tx, tyFot) === '^' && h.y + h.h > tyFot * T + 8) { drep(); return; }
  }
  if (h.y > S.høyde * T) { drep(); return; }

  // Plater
  for (const p of S.plater) {
    if (!p.tatt && overlapper(h, { x: p.x, y: p.y, w: 8, h: 8 })) {
      p.tatt = true; S.platerTatt++; S.poeng += 100; Musikk.lydPlate();
      if (S.platerTatt === S.platerTotalt) { S.dør.åpen = true; Musikk.lydÅpne(); }
    }
  }
  // Bonus: whisky gir et liv, øl gir poeng
  for (const p of S.bonus) {
    if (!p.tatt && overlapper(h, { x: p.x, y: p.y, w: 8, h: 8 })) {
      p.tatt = true;
      if (p.type === 'w') { S.liv = Math.min(5, S.liv + 1); Musikk.lydNivåOpp(); }
      else { S.poeng += 300; Musikk.lydPlate(); }
    }
  }
  // Døra
  if (S.dør.åpen && overlapper(h, { x: S.dør.x + 4, y: S.dør.y, w: 8, h: 32 })) {
    S.poeng += 500; S.fase = 'klar'; S.faseKlokke = 0; Musikk.spill(false); Musikk.lydDør();
  }
}

function oppdaterFiender(dt) {
  const h = S.helt;
  for (const f of S.fiender) {
    if (!f.levende) continue;
    if (f.type === 'rotte') {
      const nesteX = f.x + f.vx * dt;
      const front = f.vx < 0 ? nesteX : nesteX + f.w;
      const tx = Math.floor(front / T), ty = Math.floor((f.y + f.h) / T);
      const vegg = fast(flis(tx, Math.floor(f.y / T)));
      const kant = !(fast(flis(tx, ty)) || enveis(flis(tx, ty)));
      if (vegg || kant) { f.vx = -f.vx; f.retning = -f.retning; } else f.x = nesteX;
      f.anim = (f.anim || 0) + dt * 8;
    } else if (f.type === 'edderkopp') {
      if (f.tilstand === 'venter') {
        f.vent -= dt;
        if (f.vent <= 0 && Math.abs(h.x + h.w / 2 - (f.x + f.w / 2)) < 14 && h.y > f.y) f.tilstand = 'faller';
      } else if (f.tilstand === 'faller') {
        f.y += 160 * dt;
        const ty = Math.floor((f.y + f.h) / T);
        if (fast(flis(Math.floor((f.x + f.w / 2) / T), ty)) || f.y > f.ankerY + 7 * T) { f.y = Math.min(f.y, ty * T - f.h); f.tilstand = 'klatrer'; }
      } else {
        f.y -= 45 * dt;
        if (f.y <= f.ankerY) { f.y = f.ankerY; f.tilstand = 'venter'; f.vent = 1.2; }
      }
    } else if (f.type === 'flaggermus') {
      if (!f.våken) { if (Math.abs(h.x - f.x) < 110 && Math.abs(h.y - f.y) < 80) f.våken = true; }
      else {
        f.klokke = (f.klokke || 0) + dt;
        f.retning = h.x > f.x ? 1 : -1;
        f.x += f.retning * 55 * dt;
        f.y = f.startY + Math.sin(f.klokke * 4) * 24 + Math.min(40, f.klokke * 8);
      }
      f.anim = (f.anim || 0) + dt * 10;
    }

    if (h.død) continue;
    if (overlapper(h, f)) {
      // Tråkk: helten faller og har bunnen sin over fiendens midte
      if (h.vy > 0 && h.y + h.h - f.y < f.h * 0.6 + 4) {
        f.levende = false; h.vy = -220; S.poeng += 200; Musikk.lydTråkk();
      } else {
        drep();
      }
    }
  }
}

function drep() {
  const h = S.helt;
  if (h.død) return;
  h.død = true; h.vy = -260; h.vx = 0;
  S.fase = 'død'; S.faseKlokke = 0;
  Musikk.lydDød();
}

function oppdater(dt) {
  S.tid += dt;
  if (S.fase === 'spill') {
    oppdaterHelt(dt);
    if (S.fase === 'spill') oppdaterFiender(dt);
  } else if (S.fase === 'død') {
    S.faseKlokke += dt;
    oppdaterHelt(dt);
    if (S.faseKlokke > 1.4) {
      S.liv--;
      if (S.liv <= 0) {
        S.fase = 'over'; S.faseKlokke = 0; Musikk.spill(false);
        if (S.poeng > S.topp) { S.topp = S.poeng; try { localStorage.setItem(LAGRINGSNØKKEL, String(S.topp)); } catch (e) {} }
      } else {
        // Nytt forsøk: fiendene stiller seg opp igjen, platene du tok beholder du
        const tatt = S.plater.map(p => p.tatt), bonusTatt = S.bonus.map(p => p.tatt);
        lastBrett(S.brettNr);
        S.plater.forEach((p, i) => p.tatt = tatt[i]);
        S.bonus.forEach((p, i) => p.tatt = bonusTatt[i]);
        S.platerTatt = tatt.filter(Boolean).length;
        if (S.platerTatt === S.platerTotalt) S.dør.åpen = true;
        S.fase = 'spill';
      }
    }
  } else if (S.fase === 'klar') {
    S.faseKlokke += dt;
    if (S.faseKlokke > 2.2) {
      if (S.brettNr + 1 < BRETT.length) { lastBrett(S.brettNr + 1); S.fase = 'spill'; Musikk.spill(true); }
      else {
        S.fase = 'slutt'; S.faseKlokke = 0;
        if (S.poeng > S.topp) { S.topp = S.poeng; try { localStorage.setItem(LAGRINGSNØKKEL, String(S.topp)); } catch (e) {} }
      }
    }
  } else if (S.fase === 'over' || S.fase === 'slutt') {
    S.faseKlokke += dt;
  }

  // Kameraet følger helten med litt treghet
  if (S.helt) {
    const mål = Math.max(0, Math.min(S.helt.x + S.helt.w / 2 - W / 2, S.bredde * T - W));
    S.kamX += (mål - S.kamX) * Math.min(1, dt * 6);
    // Vertikalt sikter kameraet litt under helten, så du ser hvor du lander
    const målY = Math.max(0, Math.min(S.helt.y + S.helt.h / 2 - H / 2 + 12, S.høyde * T - H));
    S.kamY += (målY - S.kamY) * Math.min(1, dt * 5);
    S.banner = Math.max(0, S.banner - dt);
  }
}

/* =====================================================================
   TEGNING
   ===================================================================== */

function tegnVerden() {
  const kx = Math.round(S.kamX), ky = Math.round(S.kamY);
  const brett = BRETT[S.brettNr], bak = brett.bakgrunn && BAKGRUNNER[brett.bakgrunn];
  if (bak && bak.klar) {
    // Ekte rom: bildet er hele veggen. Mørkt over, gulvplanker under.
    fyll(hex(0x0a0608));
    const b = bak.rammer[0].h;
    blit(b, -kx, brett.bakgrunnY - ky);
    boks(0, brett.bakgrunnY + b.h - ky, W, H, hex(0x2a1a10));
  } else {
    // Bakvegg med halv fart
    const bx = Math.round(kx * 0.4) % T, by = Math.round(ky * 0.4) % T;
    for (let y = -by; y < H; y += T) for (let x = -bx; x < W; x += T) blit(BAKVEGG, x, y);
  }

  // Fliser - bare de som er synlige
  const tx0 = Math.floor(kx / T), tx1 = Math.min(S.bredde - 1, tx0 + Math.ceil(W / T) + 1);
  const ty0 = Math.floor(ky / T), ty1 = Math.min(S.høyde - 1, ty0 + Math.ceil(H / T) + 1);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const c = S.kart[ty][tx], f = FLIS[c];
    if (f) blit(f, tx * T - kx, ty * T - ky);
    // Lys kant på oversiden av usynlige plattformer, så du ser hva du kan stå på
    else if (VIS_KANTER && (c === '-' || (c === '_' && !fast(flis(tx, ty - 1))))) {
      const y = ty * T - ky;
      for (let x = 0; x < T; x++) { lysne(tx * T - kx + x, y, 0.55); lysne(tx * T - kx + x, y + 1, 0.2); }
    }
  }

  // Døra: på brett med bakgrunnsbilde ligger døra i bildet, vi tegner bare en ramme
  if (bak) {
    const f = S.dør.åpen ? (Math.floor(S.tid * 4) % 2 ? PAL[GUL] : PAL[HVIT]) : PAL[GRÅ1];
    ramme(S.dør.x - kx - 2, S.dør.y - ky - 2, 20, 36, f);
  } else blit(S.dør.åpen ? DØR.åpen : DØR.lukket, S.dør.x - kx, S.dør.y - ky);

  // Samleobjekter
  const ramme2 = Math.floor(S.tid * 6) % 2;
  const tegnObjekt = p => {
    const dy = Math.round(Math.sin(S.tid * 4 + p.x) * 1.5), ark = SAMLE_ARK[p.type];
    if (ark && ark.klar) blit(ark.rammer[Math.floor(S.tid * 10 + p.x) % ark.rammer.length].h, p.x - 4 - kx, p.y - 4 - ky + dy);
    else blit(SAMLE[p.type].rammer[ramme2], p.x - kx, p.y - ky + dy);
  };
  for (const p of S.plater) if (!p.tatt) tegnObjekt(p);
  for (const p of S.bonus) if (!p.tatt) tegnObjekt(p);

  // Fiender
  for (const f of S.fiender) {
    if (!f.levende) continue;
    const sx = f.x - kx, sy = f.y - ky;
    if (f.type === 'rotte') {
      if (ROTTE_ARK.klar) {
        const g = ROTTE_REKKEFØLGE.gå, r = g[Math.floor((f.anim || 0) * 0.8) % g.length];
        blit(ROTTE_ARK.rammer[r][f.retning < 0 ? 'v' : 'h'], sx + f.w / 2 - 12, sy + f.h - 16);
      } else blit(ROTTE[Math.floor(f.anim || 0) % 2][f.retning < 0 ? 'v' : 'h'], sx - 1, sy);
    } else if (f.type === 'edderkopp') {
      const midt = Math.round(sx + f.w / 2);
      for (let y = f.ankerY - ky; y < sy; y++) piksel(midt, y, PAL[GRÅ3]);
      if (EDDERKOPP_ARK.klar) {
        const seq = f.tilstand === 'venter' ? EDDERKOPP_REKKEFØLGE.heng : EDDERKOPP_REKKEFØLGE.slipp;
        const r = seq[Math.floor(S.tid * (f.tilstand === 'venter' ? 2 : 8)) % seq.length];
        blit(EDDERKOPP_ARK.rammer[r].v, sx + f.w / 2 - 8, sy + f.h - 16);
      } else blit(EDDERKOPP, sx, sy);
    } else if (FLAGGERMUS_ARK.klar) {
      const seq = !f.våken ? FLAGGERMUS_REKKEFØLGE.sover : (f.y > f.startY + 20 ? FLAGGERMUS_REKKEFØLGE.dykk : FLAGGERMUS_REKKEFØLGE.fly);
      const r = seq[Math.floor((f.anim || 0) * (f.våken ? 1 : 0.2)) % seq.length];
      blit(FLAGGERMUS_ARK.rammer[r][f.retning < 0 ? 'v' : 'h'], sx + f.w / 2 - 12, sy + f.h / 2 - 8);
    } else blit(FLAGGERMUS[Math.floor(f.anim || 0) % 2], sx, sy);
  }

  // Helten
  const h = S.helt;
  if (h.død && Math.floor(S.faseKlokke * 12) % 2) { /* blink */ }
  else if (ARK.klar) {
    // Velg ramme fra arket. Boksen er 12x30, arket 32x32 med føttene nederst i midten.
    let r;
    if (h.død) r = ARK_REKKEFØLGE.fall[1];
    else if (!h.påBakken) r = h.vy < -40 ? ARK_REKKEFØLGE.hopp[1] : h.vy < 60 ? ARK_REKKEFØLGE.hopp[2] : ARK_REKKEFØLGE.fall[0];
    else if (Math.abs(h.vx) > 5) { const g = ARK_REKKEFØLGE.gå; r = g[Math.floor(h.anim * 1.2) % g.length]; }
    else { const i = ARK_REKKEFØLGE.idle; r = i[Math.floor(S.tid * 3) % i.length]; }
    const b = ARK.rammer[r][h.retning < 0 ? 'v' : 'h'];
    blit(b, h.x + h.w / 2 - ARK_RAMME / 2 - kx, h.y + h.h - ARK_RAMME - ky);
  } else {
    let ramme = 'stå';
    if (h.død || !h.påBakken) ramme = 'hopp';
    else if (Math.abs(h.vx) > 5) ramme = ['løp1', 'stå', 'løp2', 'stå'][Math.floor(h.anim) % 4];
    blit(HELT[ramme][h.retning < 0 ? 'v' : 'h'], h.x - 1 - kx, h.y + h.h - 16 - ky);
  }
}

function tegnHUD() {
  boks(0, 0, W, 11, PAL[SVART]);
  let liv = ''; for (let i = 0; i < S.liv; i++) liv += '♥';
  tekst(liv, 3, 2, 1, PAL[LYSRØD]);
  blit(SAMLE.o.rammer[0], 30, 1);
  tekst(S.platerTatt + '/' + S.platerTotalt, 40, 2, 1, PAL[LYSBLÅ]);
  const p = String(S.poeng).padStart(6, '0');
  tekst(p, W - 3 - p.length * 8, 2, 1, PAL[HVIT]);
  if (S.banner > 0 && S.fase === 'spill') {
    const navn = 'ETASJE ' + (S.brettNr + 1) + ': ' + BRETT[S.brettNr].navn;
    boks(0, H * 0.15, W, 12, PAL[SVART]);
    tekstMidt(navn, W / 2, H * 0.15 + 2, 1, PAL[GUL]);
  }
}

function tegnMelding(linjer, y0, farger) {
  const bredde = Math.max(...linjer.map(l => l.length)) * 8 + 24, x0 = (W - bredde) / 2;
  boks(x0, y0 - 8, bredde, linjer.length * 12 + 12, PAL[SVART]);
  boks(x0, y0 - 8, bredde, 1, PAL[LYSBLÅ]); boks(x0, y0 + linjer.length * 12 + 3, bredde, 1, PAL[LYSBLÅ]);
  linjer.forEach((l, i) => tekstMidt(l, W / 2, y0 + i * 12, 1, PAL[farger[i] ?? HVIT]));
}

function tegnAlt() {
  if (S.fase === 'tittel') {
    fyll(hex(0x181228));
    for (let y = 0; y < H; y += T) for (let x = 0; x < W; x += T) blit(BAKVEGG, x, y);
    for (let x = 0; x < W; x += T) blit(FLIS['#'], x, H - T);
    const y0 = Math.round((H - 136) / 2);
    tekstMedSkygge('KJELLEREN', W / 2 - 9 * 8 + 4, y0 + 10, 2, PAL[GUL]);
    tekstMidt('SAMLE ALT DU FINNER.', W / 2, y0 + 36, 1, PAL[LYSBLÅ]);
    tekstMidt('FINN DØRA TIL', W / 2, y0 + 46, 1, PAL[LYSBLÅ]);
    tekstMidt('NESTE ROM I HUSET.', W / 2, y0 + 56, 1, PAL[LYSBLÅ]);
    const r = Math.floor(S.tid * 6) % 2;
    ['o', 'k', 'e', 'v', 'w', 'ø'].forEach((t, i) => { const a = SAMLE_ARK[t]; if (a && a.klar) blit(a.rammer[Math.floor(S.tid * 8 + i) % a.rammer.length].h, W / 2 - 60 + i * 20, y0 + 66); else blit(SAMLE[t].rammer[r], W / 2 - 56 + i * 20, y0 + 70); });
    tekstMidt('PILER + MELLOMROM', W / 2, y0 + 88, 1, PAL[GRÅ3]);
    if (Math.floor(S.tid * 2) % 2 === 0) tekstMidt('TRYKK MELLOMROM', W / 2, y0 + 102, 1, PAL[HVIT]);
    if (ARK.klar) blit(ARK.rammer[ARK_REKKEFØLGE.idle[Math.floor(S.tid * 3) % 4]].h, 14, H - T - 32); else blit(HELT.stå.h, 20, H - T - 16);
    if (ROTTE_ARK.klar) blit(ROTTE_ARK.rammer[Math.floor(S.tid * 4) % 2].v, W - 40, H - T - 16); else blit(ROTTE[Math.floor(S.tid * 8) % 2].v, W - 36, H - T - 8);
    if (S.topp) tekst('TOPP ' + S.topp, 3, H - 9, 1, PAL[GRÅ1]);
    return;
  }
  tegnVerden();
  tegnHUD();
  if (S.fase === 'klar') tegnMelding(['DU FANT DØRA!', '+500'], H * 0.38, [GUL, HVIT]);
  else if (S.fase === 'over') tegnMelding(['SPILLET ER OVER', S.poeng >= S.topp ? 'NY TOPP: ' + S.poeng : 'POENG: ' + S.poeng, S.faseKlokke > 1.5 ? 'MELLOMROM' : ''], H * 0.34, [LYSRØD, HVIT, GRÅ3]);
  else if (S.fase === 'slutt') tegnMelding(['DU RYDDET HELE HUSET', 'ALT ER HJEMME IGJEN.', 'POENG: ' + S.poeng, S.faseKlokke > 2 ? 'MELLOMROM' : ''], H * 0.3, [GUL, LYSBLÅ, HVIT, GRÅ3]);
}

/* =====================================================================
   LØKKE OG INPUT
   ===================================================================== */

let forrige = 0;
function løkke(nå) {
  const dt = Math.min(0.04, (nå - forrige) / 1000 || 0);
  forrige = nå;
  oppdater(dt);
  tegnAlt();
  ctx.putImageData(bilde, 0, 0);
  requestAnimationFrame(løkke);
}
requestAnimationFrame(løkke);

function hovedknapp() {
  Musikk.start();
  if (S.fase === 'tittel') startSpill();
  else if (S.fase === 'over' && S.faseKlokke > 1.5) { S.fase = 'tittel'; }
  else if (S.fase === 'slutt' && S.faseKlokke > 2) { S.fase = 'tittel'; }
}

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': S.taster.venstre = true; break;
    case 'ArrowRight': case 'KeyD': S.taster.høyre = true; break;
    case 'Space': case 'ArrowUp': case 'KeyW': case 'KeyZ':
      S.taster.hopp = true;
      if (S.fase === 'spill') S.hoppTrykket = true; else hovedknapp();
      break;
    case 'Enter': hovedknapp(); break;
    case 'KeyM': Musikk.vekslDemp(); break;
    case 'KeyF':
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      break;
  }
});
addEventListener('keyup', e => {
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': S.taster.venstre = false; break;
    case 'ArrowRight': case 'KeyD': S.taster.høyre = false; break;
    case 'Space': case 'ArrowUp': case 'KeyW': case 'KeyZ': S.taster.hopp = false; break;
  }
});
addEventListener('pointerdown', () => { if (S.fase !== 'spill' && S.fase !== 'død' && S.fase !== 'klar') hovedknapp(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) S.taster = {}; });
</script>
